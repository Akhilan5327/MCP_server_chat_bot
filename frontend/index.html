<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eeebe3;
    --card: #fbfaf7;
    --ink: #262220;
    --ink-muted: #837a6e;
    --ink-blue: #33435e;
    --ink-blue-dark: #263349;
    --border: #d8d2c4;
    --error: #a8402f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(38,34,32,0.05) 1px, transparent 0);
    background-size: 18px 18px;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    height: min(720px, 90vh);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(38,34,32,0.06), 0 12px 32px rgba(38,34,32,0.10);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .header {
    background: var(--ink-blue);
    color: var(--paper);
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mark {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--paper);
    color: var(--ink-blue);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 15px;
    flex-shrink: 0;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-text h1 {
    margin: 0;
    font-size: 15.5px;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .status {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: rgba(238,235,227,0.72);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #7fa876; flex-shrink: 0; }
  .dot.off { background: #c26a5c; }
  .dot.pending { background: #c9bb7a; }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 82%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14.5px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.assistant .bubble {
    background: #fff;
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    color: var(--ink);
  }
  .row.user .bubble {
    background: var(--ink-blue);
    color: var(--paper);
    border-top-right-radius: 4px;
  }
  .row.error .bubble {
    background: #fbe9e6;
    border: 1px solid #e3b2a6;
    color: var(--error);
    border-top-left-radius: 4px;
  }
  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--ink-muted);
    font-size: 14px;
    max-width: 320px;
    line-height: 1.6;
  }
  .empty strong { color: var(--ink); }

  .quote-panel {
    border-top: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    gap: 6px;
    align-items: center;
    background: var(--paper);
    font-size: 13px;
    flex-wrap: wrap;
  }
  .quote-panel select, .quote-panel input[type="number"] {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 6px;
    background: #fff;
    color: var(--ink);
  }
  .quote-panel input[type="number"] { width: 50px; }
  .quote-panel input[type="file"] { flex: 1; min-width: 140px; font-size: 12px; }
  .quote-panel button {
    background: var(--ink-blue);
    color: var(--paper);
    border: none;
    border-radius: 6px;
    padding: 5px 12px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .quote-panel button:hover { background: var(--ink-blue-dark); }
  .quote-panel button#qClear {
    background: transparent;
    color: var(--ink-muted);
    border: 1px solid var(--border);
    padding: 5px 9px;
  }
  .quote-panel button#qClear:hover { background: #fff; }
  .file-hint {
    font-size: 11.5px;
    color: var(--ink-muted);
    padding: 0 14px 8px;
    background: var(--paper);
  }

  .composer {
    border-top: 1px solid var(--border);
    padding: 14px;
    display: flex;
    gap: 8px;
    background: var(--card);
  }
  #attachBtn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 0 12px;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  #attachBtn:hover { background: var(--paper); }
  .composer input {
    flex: 1;
    border: 1px solid var(--border);
    background: var(--paper);
    border-radius: 9px;
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }
  .composer input:focus { border-color: var(--ink-blue); }
  .composer button#sendBtn {
    background: var(--ink-blue);
    color: var(--paper);
    border: none;
    border-radius: 9px;
    padding: 0 18px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button#sendBtn:hover:not(:disabled) { background: var(--ink-blue-dark); }
  .composer button#sendBtn:disabled { opacity: 0.45; cursor: default; }

  .messages::-webkit-scrollbar { width: 8px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="mark">S</div>
    <div class="header-text">
      <h1>Shop Assistant</h1>
      <p class="status" id="status"><span class="dot pending" id="statusDot"></span><span id="statusText">Connecting…</span></p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      Ask about <strong>prices</strong>, <strong>shop hours</strong>, or services like <strong>Aadhar</strong>, <strong>PAN card</strong>, or <strong>printing</strong>. Or tap 📎 to upload a PDF for an instant quote.
    </div>
  </div>

  <div class="quote-panel" id="quotePanel" style="display:none;">
    <input type="file" id="pdfFile" accept="application/pdf" />
    <select id="qService">
      <option value="Print">Print</option>
      <option value="Photocopy">Photocopy</option>
    </select>
    <select id="qColor">
      <option value="bw">B/W</option>
      <option value="color">Color</option>
    </select>
    <input type="number" id="qCopies" min="1" value="1" title="Copies" />
    <button id="qSubmit" type="button">Get Quote</button>
    <button id="qClear" type="button" title="Remove file">✕</button>
  </div>
  <div class="file-hint" id="fileHint" style="display:none;"></div>

  <div class="composer">
    <button id="attachBtn" type="button" title="Quote a PDF">📎</button>
    <input type="text" id="input" placeholder="Ask something…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // Fixed API base: this page is always served by the same backend it talks
  // to (FastAPI serves this file directly via GET /), so the API lives at
  // the same origin the page was loaded from. No user-editable field needed
  // or wanted here - mistyping it would silently break the chat with no
  // clear explanation, so it's simpler and safer to just derive it.
  //
  // Exception: opening this file directly from disk (file://) for local
  // testing, where there's no "origin" to derive from - falls back to the
  // local dev server address in that case.
  const API_BASE = (location.protocol === 'file:')
    ? 'http://localhost:8000'
    : location.origin;

  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const attachBtn = document.getElementById('attachBtn');
  const quotePanel = document.getElementById('quotePanel');
  const pdfFile = document.getElementById('pdfFile');
  const qService = document.getElementById('qService');
  const qColor = document.getElementById('qColor');
  const qCopies = document.getElementById('qCopies');
  const qSubmit = document.getElementById('qSubmit');
  const qClear = document.getElementById('qClear');
  const fileHint = document.getElementById('fileHint');

  const sessionId = 'ui-' + Math.random().toString(36).slice(2, 10);
  let busy = false;

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function updateFileHint() {
    if (pdfFile.files.length) {
      fileHint.style.display = 'block';
      fileHint.textContent = 'Using: ' + pdfFile.files[0].name + ' — change options above and click Get Quote again to re-quote the same file.';
    } else {
      fileHint.style.display = 'none';
      fileHint.textContent = '';
    }
  }

  async function checkHealth() {
    try {
      const res = await fetch(API_BASE + '/health');
      if (!res.ok) throw new Error();
      const data = await res.json();
      statusDot.className = 'dot';
      statusText.textContent = data.tools_loaded + ' tools ready';
    } catch {
      statusDot.className = 'dot off';
      statusText.textContent = 'Offline — try again shortly';
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch(API_BASE + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      removeTyping();
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      addMessage('assistant', data.reply || '(empty reply)');
    } catch (err) {
      removeTyping();
      addMessage('error', "Couldn't reach the shop assistant. Please try again in a moment.");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  attachBtn.addEventListener('click', () => {
    quotePanel.style.display = quotePanel.style.display === 'none' ? 'flex' : 'none';
  });

  pdfFile.addEventListener('change', updateFileHint);

  qClear.addEventListener('click', () => {
    pdfFile.value = '';
    updateFileHint();
    quotePanel.style.display = 'none';
  });

  qSubmit.addEventListener('click', async () => {
    if (busy) return;
    if (!pdfFile.files.length) {
      addMessage('error', 'Choose a PDF file first.');
      return;
    }
    const chosenFile = pdfFile.files[0];
    const MAX_SIZE_MB = 20;
    if (chosenFile.size > MAX_SIZE_MB * 1024 * 1024) {
      addMessage('error', `That file is ${(chosenFile.size / (1024*1024)).toFixed(1)} MB — please upload a PDF under ${MAX_SIZE_MB} MB.`);
      return;
    }

    const formData = new FormData();
    formData.append('file', chosenFile);
    formData.append('service_name', qService.value);
    formData.append('color_mode', qColor.value);
    formData.append('copies', qCopies.value);

    busy = true;
    qSubmit.disabled = true;
    addMessage('user', `Quote request: ${chosenFile.name} (${qService.value}, ${qColor.value === 'bw' ? 'B/W' : 'Color'}, x${qCopies.value})`);
    addTyping();

    try {
      const res = await fetch(API_BASE + '/upload-quote', { method: 'POST', body: formData });
      removeTyping();
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      if (data.error) {
        addMessage('error', data.error);
      } else {
        const q = data.quote;
        let text = `${data.page_count} page(s) x ${qCopies.value} copies = ${q.total_pages} total pages.\n`;
        text += `Rate: INR ${q.price_per_page}/page.\n`;
        if (q.discount_pct > 0) {
          text += `Bulk discount: ${q.discount_pct}% (-INR ${q.discount_amount})\n`;
        }
        text += `Total: INR ${q.total}\n\nWant it in ${qColor.value === 'bw' ? 'color' : 'B/W'} instead? Just switch the option above and click Get Quote again — no need to re-upload.`;
        addMessage('assistant', text);
      }
    } catch (err) {
      removeTyping();
      addMessage('error', "Couldn't reach the server for the quote.");
    } finally {
      busy = false;
      qSubmit.disabled = false;
    }
  });

  checkHealth();
  inputEl.focus();
</script>

</body>
</html>
