<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --surface: #ffffff;
    --surface-alt: #fafafa;
    --ink: #111111;
    --ink-muted: #8a8a8a;
    --accent: #111111;
    --accent-ink: #ffffff;
    --border: #e8e8e8;
    --border-soft: #f0f0f0;
    --error-bg: #fdf2f1;
    --error-border: #f3d3cf;
    --error-ink: #b3402f;
    --radius: 16px;
    --radius-sm: 10px;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .app {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 760px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 1px 1px rgba(0,0,0,0.02), 0 16px 40px rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Header ---------- */
  .header {
    padding: 18px 20px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid var(--border-soft);
    flex-shrink: 0;
  }
  .mark {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 600;
    font-size: 13px;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .header-text { flex: 1; min-width: 0; }
  .header-text h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .status {
    margin: 3px 0 0;
    font-size: 12.5px;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .dot {
    width: 5px; height: 5px; border-radius: 50%;
    background: #7fb46c;
    flex-shrink: 0;
    transition: background 0.3s ease;
  }
  .dot.off { background: #d97b6c; }
  .dot.pending { background: #d9c26c; }

  /* ---------- Messages ---------- */
  .messages {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    scroll-behavior: smooth;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .row { display: flex; animation: rise 0.28s ease both; }
  .row.user { justify-content: flex-end; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble {
    max-width: 84%;
    padding: 10px 14px;
    border-radius: var(--radius-sm);
    font-size: 14.5px;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .row.assistant .bubble {
    background: var(--surface-alt);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  .row.user .bubble {
    background: var(--ink);
    color: var(--bg);
    border-bottom-right-radius: 4px;
  }
  .row.error .bubble {
    background: var(--error-bg);
    border: 1px solid var(--error-border);
    color: var(--error-ink);
    border-bottom-left-radius: 4px;
  }

  .typing {
    display: inline-flex;
    gap: 4px;
    padding: 4px 2px;
  }
  .typing span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--ink-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .empty {
    margin: auto;
    text-align: center;
    color: var(--ink-muted);
    font-size: 13.5px;
    max-width: 280px;
    line-height: 1.65;
  }
  .empty strong { color: var(--ink); font-weight: 600; }

  /* ---------- Quote panel ---------- */
  .quote-panel {
    border-top: 1px solid var(--border-soft);
    padding: 12px 14px;
    display: flex;
    gap: 6px;
    align-items: center;
    background: var(--surface-alt);
    font-size: 13px;
    flex-wrap: wrap;
    overflow: hidden;
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    border-top-width: 0;
    transition: max-height 0.25s ease, padding 0.25s ease, border-top-width 0.25s ease;
  }
  .quote-panel.open {
    max-height: 200px;
    padding: 12px 14px;
    border-top-width: 1px;
  }
  .quote-panel select, .quote-panel input[type="number"] {
    font-family: inherit;
    font-size: 13px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 5px 7px;
    background: var(--surface);
    color: var(--ink);
  }
  .quote-panel input[type="number"] { width: 52px; }
  .quote-panel input[type="file"] {
    flex: 1;
    min-width: 130px;
    font-size: 12px;
    color: var(--ink-muted);
  }
  .quote-panel button {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: 8px;
    padding: 6px 13px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .quote-panel button:hover { opacity: 0.82; }
  .quote-panel button#qClear {
    background: transparent;
    color: var(--ink-muted);
    border: 1px solid var(--border);
    padding: 6px 10px;
  }
  .quote-panel button#qClear:hover { background: var(--surface); opacity: 1; }

  .file-hint {
    font-size: 11.5px;
    color: var(--ink-muted);
    padding: 0 20px 10px;
    background: var(--surface-alt);
  }

  /* ---------- Composer ---------- */
  .composer {
    border-top: 1px solid var(--border-soft);
    padding: 14px;
    padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex;
    gap: 8px;
    background: var(--surface);
    flex-shrink: 0;
  }
  #attachBtn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 0 13px;
    cursor: pointer;
    font-size: 15px;
    flex-shrink: 0;
    color: var(--ink-muted);
    transition: background 0.15s ease, color 0.15s ease;
  }
  #attachBtn:hover { background: var(--border-soft); color: var(--ink); }
  #attachBtn.active { color: var(--ink); border-color: var(--ink); }

  .composer input {
    flex: 1;
    min-width: 0;
    border: 1px solid var(--border);
    background: var(--surface-alt);
    border-radius: var(--radius-sm);
    padding: 11px 14px;
    font-family: inherit;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }
  .composer input:focus { border-color: var(--ink); }

  .composer button#sendBtn {
    background: var(--ink);
    color: var(--bg);
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 18px;
    font-family: inherit;
    font-size: 14.5px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .composer button#sendBtn:hover:not(:disabled) { opacity: 0.82; }
  .composer button#sendBtn:disabled { opacity: 0.35; cursor: default; }

  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .messages::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Responsive ---------- */
  @media (max-width: 600px) {
    body { padding: 0; align-items: stretch; }
    .app {
      max-width: 100%;
      max-height: none;
      height: 100%;
      border-radius: 0;
      border: none;
      box-shadow: none;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .row { animation: none; }
    .messages { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="mark">S</div>
    <div class="header-text">
      <h1>Shop Assistant</h1>
      <p class="status" id="status"><span class="dot pending" id="statusDot"></span><span id="statusText">Connecting…</span></p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="empty" id="emptyState">
      Ask about <strong>prices</strong>, <strong>shop hours</strong>, or services like <strong>Aadhar</strong>, <strong>PAN card</strong>, or <strong>printing</strong>. Or tap 📎 to upload a PDF for an instant quote.
    </div>
  </div>

  <div class="quote-panel" id="quotePanel">
    <input type="file" id="pdfFile" accept="application/pdf" />
    <select id="qService">
      <option value="Print">Print</option>
      <option value="Photocopy">Photocopy</option>
    </select>
    <select id="qColor">
      <option value="bw">B/W</option>
      <option value="color">Color</option>
    </select>
    <input type="number" id="qCopies" min="1" value="1" title="Copies" />
    <button id="qSubmit" type="button">Get Quote</button>
    <button id="qClear" type="button" title="Remove file">✕</button>
  </div>
  <div class="file-hint" id="fileHint" style="display:none;"></div>

  <div class="composer">
    <button id="attachBtn" type="button" title="Quote a PDF">📎</button>
    <input type="text" id="input" placeholder="Ask something…" autocomplete="off" />
    <button id="sendBtn">Send</button>
  </div>
</div>

<script>
  // Fixed API base: this page is always served by the same backend it talks
  // to (FastAPI serves this file directly via GET /), so the API lives at
  // the same origin the page was loaded from. No user-editable field needed
  // or wanted here - mistyping it would silently break the chat with no
  // clear explanation, so it's simpler and safer to just derive it.
  //
  // Exception: opening this file directly from disk (file://) for local
  // testing, where there's no "origin" to derive from - falls back to the
  // local dev server address in that case.
  const API_BASE = (location.protocol === 'file:')
    ? 'http://localhost:8000'
    : location.origin;

  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const inputEl = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');

  const attachBtn = document.getElementById('attachBtn');
  const quotePanel = document.getElementById('quotePanel');
  const pdfFile = document.getElementById('pdfFile');
  const qService = document.getElementById('qService');
  const qColor = document.getElementById('qColor');
  const qCopies = document.getElementById('qCopies');
  const qSubmit = document.getElementById('qSubmit');
  const qClear = document.getElementById('qClear');
  const fileHint = document.getElementById('fileHint');

  const sessionId = 'ui-' + Math.random().toString(36).slice(2, 10);
  let busy = false;

  function addMessage(role, text) {
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = text;
    row.appendChild(bubble);
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'row assistant';
    row.id = 'typingRow';
    row.innerHTML = '<div class="bubble"><span class="typing"><span></span><span></span><span></span></span></div>';
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function removeTyping() {
    const row = document.getElementById('typingRow');
    if (row) row.remove();
  }

  function updateFileHint() {
    if (pdfFile.files.length) {
      fileHint.style.display = 'block';
      fileHint.textContent = 'Using: ' + pdfFile.files[0].name + ' — change options above and click Get Quote again to re-quote the same file.';
    } else {
      fileHint.style.display = 'none';
      fileHint.textContent = '';
    }
  }

  async function checkHealth() {
    try {
      const res = await fetch(API_BASE + '/health');
      if (!res.ok) throw new Error();
      const data = await res.json();
      statusDot.className = 'dot';
      statusText.textContent = data.tools_loaded + ' tools ready';
    } catch {
      statusDot.className = 'dot off';
      statusText.textContent = 'Offline — try again shortly';
    }
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || busy) return;
    busy = true;
    sendBtn.disabled = true;
    inputEl.value = '';
    addMessage('user', text);
    addTyping();

    try {
      const res = await fetch(API_BASE + '/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text, session_id: sessionId }),
      });
      removeTyping();
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      addMessage('assistant', data.reply || '(empty reply)');
    } catch (err) {
      removeTyping();
      addMessage('error', "Couldn't reach the shop assistant. Please try again in a moment.");
    } finally {
      busy = false;
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener('click', sendMessage);
  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') sendMessage();
  });

  attachBtn.addEventListener('click', () => {
    const willOpen = !quotePanel.classList.contains('open');
    quotePanel.classList.toggle('open', willOpen);
    attachBtn.classList.toggle('active', willOpen);
  });

  pdfFile.addEventListener('change', updateFileHint);

  qClear.addEventListener('click', () => {
    pdfFile.value = '';
    updateFileHint();
    quotePanel.classList.remove('open');
    attachBtn.classList.remove('active');
  });

  qSubmit.addEventListener('click', async () => {
    if (busy) return;
    if (!pdfFile.files.length) {
      addMessage('error', 'Choose a PDF file first.');
      return;
    }
    const chosenFile = pdfFile.files[0];
    const MAX_SIZE_MB = 20;
    if (chosenFile.size > MAX_SIZE_MB * 1024 * 1024) {
      addMessage('error', `That file is ${(chosenFile.size / (1024*1024)).toFixed(1)} MB — please upload a PDF under ${MAX_SIZE_MB} MB.`);
      return;
    }

    const formData = new FormData();
    formData.append('file', chosenFile);
    formData.append('service_name', qService.value);
    formData.append('color_mode', qColor.value);
    formData.append('copies', qCopies.value);

    busy = true;
    qSubmit.disabled = true;
    addMessage('user', `Quote request: ${chosenFile.name} (${qService.value}, ${qColor.value === 'bw' ? 'B/W' : 'Color'}, x${qCopies.value})`);
    addTyping();

    try {
      const res = await fetch(API_BASE + '/upload-quote', { method: 'POST', body: formData });
      removeTyping();
      if (!res.ok) throw new Error('Server returned ' + res.status);
      const data = await res.json();
      if (data.error) {
        addMessage('error', data.error);
      } else {
        const q = data.quote;
        let text = `${data.page_count} page(s) x ${qCopies.value} copies = ${q.total_pages} total pages.\n`;
        text += `Rate: INR ${q.price_per_page}/page.\n`;
        if (q.discount_pct > 0) {
          text += `Bulk discount: ${q.discount_pct}% (-INR ${q.discount_amount})\n`;
        }
        text += `Total: INR ${q.total}\n\nWant it in ${qColor.value === 'bw' ? 'color' : 'B/W'} instead? Just switch the option above and click Get Quote again — no need to re-upload.`;
        addMessage('assistant', text);
      }
    } catch (err) {
      removeTyping();
      addMessage('error', "Couldn't reach the server for the quote.");
    } finally {
      busy = false;
      qSubmit.disabled = false;
    }
  });

  checkHealth();
  inputEl.focus();
</script>

</body>
</html>
